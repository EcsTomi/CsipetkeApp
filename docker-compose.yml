services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: csipetke
      POSTGRES_USER: csipetke_db_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    deploy:
      resources:
        limits:
          cpus: "1.5"
        reservations:
          cpus: "1.0"

  backend:
    build: ./backend
    volumes:
      - backend_uploads:/app/uploads
      - archive_data:/app/archive_photos
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://csipetke_db_user:${DB_PASSWORD}@db:5432/csipetke
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
    depends_on:
      - db
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "3.0"
        reservations:
          cpus: "2.0"

  archive-static:
    image: nginx:alpine
    volumes:
      - archive_data:/var/www/archive_photos:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.archive-static.rule=Host(`localhost:4000`, `localhost:4200`) && PathPrefix(`/img/archive`)"
      - "traefik.http.routers.archive-static.entrypoints=websecure"
      - "traefik.http.routers.archive-static.tls.certresolver=letsencrypt"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_uploads:
  archive_data: